# /etc/init/dm-screen.conf  for servers with upstart instead of systemd (Ubuntu 14.04).
# Same job as dm-screen.service: runs as dmscreen with the settings from /etc/dm-screen.env.
# Logs go to /var/log/upstart/dm-screen.log. Control it with: start|stop|restart|status dm-screen
description "DM Screen"

start on (local-filesystems and net-device-up IFACE!=lo)
stop on runlevel [!2345]

respawn
respawn limit 10 60

script
  set -a
  . /etc/dm-screen.env
  set +a
  exec start-stop-daemon --start --chuid dmscreen --chdir /opt/dm-screen --exec /opt/node22/bin/node -- server/index.js
end script
