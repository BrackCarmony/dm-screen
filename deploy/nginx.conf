# /etc/nginx/sites-available/dm-screen  for dm-screen.brackcarmony.com
server {
    listen 80;
    server_name dm-screen.brackcarmony.com;

    # Live player view (server-sent events): /api/public/<link>/stream
    location ~ ^/api/public/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
